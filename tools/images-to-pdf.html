<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Images to PDF - Squeeze</title>
<meta name="description" content="Convert images to PDF offline.">
<meta name="theme-color" content="#080c1e">
<link rel="icon" type="image/png" href="../icon-192.png">
<link rel="stylesheet" href="../style.css">
<style>
.img-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:12px; margin-top:16px; }
.img-thumb { border:1px solid var(--gb); border-radius:10px; overflow:hidden; position:relative; aspect-ratio:1; background:rgba(255,255,255,.04); }
.img-thumb img { width:100%; height:100%; object-fit:cover; }
.img-thumb .rm { position:absolute; top:4px; right:4px; background:rgba(0,0,0,.6); color:white; border:none; border-radius:50%; width:22px; height:22px; font-size:.8rem; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.img-thumb .pg-num { position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,.5); color:white; font-size:.7rem; text-align:center; padding:2px; font-weight:700; }
</style>
</head>
<body class="tool-page">
<header class="site-header">
  <div class="header-inner">
    <a href="../index.html" class="logo"><span class="logo-icon">&#10216;S&#10217;</span><span class="logo-text">Squeeze</span></a>
    <p class="tagline">100% Offline &middot; Nothing Uploaded</p>
    <div class="header-badge"><span class="badge-dot"></span><span>Local Processing</span></div>
  </div>
</header>
<div class="tool-page-header">
  <div>
    <a href="../index.html" class="back-link">&#8592; All Tools</a>
    <div style="display:flex;align-items:flex-start;gap:16px">
      <div class="tool-page-icon" style="background:linear-gradient(135deg,#e879f9,#8b5cf6)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="32" height="32"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><rect x="8" y="13" width="8" height="6" rx="1"/><circle cx="10" cy="15" r="1"/></svg>
      </div>
      <div class="tool-page-title"><h1>Images to PDF</h1><p>Combine JPG, PNG, WebP images into a single PDF</p></div>
    </div>
  </div>
</div>

<div class="panel" style="max-width:900px;margin:0 auto 20px">
  <div class="drop-zone" id="drop">
    <input type="file" id="file-in" accept="image/*" multiple>
    <span class="drop-icon">&#128444;</span>
    <p class="drop-text">Drop images here (multiple)</p>
    <p class="drop-hint">JPG, PNG, WebP, GIF, BMP supported</p>
  </div>
  <div id="controls" class="controls" hidden>
    <div class="control-row">
      <span class="control-label">Page Size</span>
      <select id="page-size">
        <option value="A4">A4</option>
        <option value="Letter">Letter</option>
        <option value="A3">A3</option>
        <option value="fit">Fit to Image</option>
      </select>
    </div>
    <div class="control-row">
      <span class="control-label">Orientation</span>
      <div class="radio-group">
        <label class="radio-pill"><input type="radio" name="ori" value="auto" checked> <span>Auto</span></label>
        <label class="radio-pill"><input type="radio" name="ori" value="portrait"> <span>Portrait</span></label>
        <label class="radio-pill"><input type="radio" name="ori" value="landscape"> <span>Landscape</span></label>
      </div>
    </div>
    <div class="control-row">
      <span class="control-label">Margin</span>
      <select id="margin">
        <option value="0">No Margin</option>
        <option value="20" selected>Small (20pt)</option>
        <option value="40">Normal (40pt)</option>
        <option value="60">Large (60pt)</option>
      </select>
    </div>
  </div>
  <div class="img-grid" id="img-grid"></div>
  <div class="action-row" id="action-row" hidden>
    <button class="btn-primary" id="run-btn">&#9889; Create PDF</button>
    <button class="btn-secondary" id="add-more">&#43; Add More</button>
    <button class="btn-secondary" id="reset-btn">&#128472; Reset</button>
  </div>
  <div class="result-summary" id="summary" hidden></div>
</div>

<script src="_shared.js"></script>
<script>
(async () => {
  const fileIn = $('#file-in'), drop = $('#drop'), controls = $('#controls');
  const imgGrid = $('#img-grid'), actionRow = $('#action-row'), summary = $('#summary');
  let images = [];

  function addImages(newFiles) {
    const allowed = ['image/jpeg','image/png','image/webp','image/gif','image/bmp','image/avif'];
    newFiles.filter(f => allowed.includes(f.type) || /\.(jpe?g|png|webp|gif|bmp|avif)$/i.test(f.name)).forEach(f => images.push(f));
    render();
  }

  function render() {
    imgGrid.innerHTML = '';
    if (!images.length) { controls.hidden = true; actionRow.hidden = true; return; }
    controls.hidden = false; actionRow.hidden = false;
    images.forEach((f, i) => {
      const url = URL.createObjectURL(f);
      const wrap = document.createElement('div');
      wrap.className = 'img-thumb';
      wrap.innerHTML = `<img src="${url}" alt="${f.name}">
        <button class="rm" onclick="removeImg(${i})" title="Remove">&#10005;</button>
        <div class="pg-num">Page ${i+1}</div>`;
      imgGrid.appendChild(wrap);
    });
  }

  window.removeImg = (i) => { images.splice(i, 1); render(); };

  const PAGE_SIZES = { A4: [595.28, 841.89], Letter: [612, 792], A3: [841.89, 1190.55] };

  $('#run-btn').addEventListener('click', async () => {
    if (!images.length) return;
    $('#run-btn').disabled = true; $('#run-btn').innerHTML = '<span class="spinner"></span> Building PDF...';
    try {
      const { PDFDocument } = await getPdfLib();
      const pdf = await PDFDocument.create();
      const pageSz = $('#page-size').value;
      const ori = document.querySelector('input[name=ori]:checked').value;
      const margin = parseInt($('#margin').value);

      for (const file of images) {
        const ab = await file.arrayBuffer();
        let img;
        try {
          if (file.type === 'image/png') img = await pdf.embedPng(ab);
          else img = await pdf.embedJpg(ab);
        } catch {
          // fallback: draw to canvas and re-export as jpg
          const bmp = await createImageBitmap(file);
          const c = document.createElement('canvas');
          c.width = bmp.width; c.height = bmp.height;
          c.getContext('2d').drawImage(bmp, 0, 0);
          const jpgBlob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
          img = await pdf.embedJpg(await jpgBlob.arrayBuffer());
        }

        let [pw, ph] = pageSz === 'fit' ? [img.width, img.height] : (PAGE_SIZES[pageSz] || PAGE_SIZES.A4);
        const autoLand = ori === 'auto' ? img.width > img.height : ori === 'landscape';
        if (autoLand && pw < ph) [pw, ph] = [ph, pw];

        const page = pdf.addPage([pw, ph]);
        const avW = pw - margin * 2, avH = ph - margin * 2;
        const scale = Math.min(avW / img.width, avH / img.height);
        const w = img.width * scale, h = img.height * scale;
        page.drawImage(img, { x: margin + (avW - w) / 2, y: margin + (avH - h) / 2, width: w, height: h });
      }

      const bytes = await pdf.save();
      const blob = new Blob([bytes], { type: 'application/pdf' });
      summary.hidden = false;
      summary.innerHTML = `<strong>${images.length} images combined &rarr; ${fmt(blob.size)}</strong><br>
        <div class="action-row"><button class="btn-primary" id="dl-btn">&#8659; Download PDF</button></div>`;
      $('#dl-btn').addEventListener('click', () => download(blob, 'images.pdf'));
      toast('PDF created!', 'success');
    } catch(e) { toast('Error: ' + e.message, 'error'); }
    $('#run-btn').disabled = false; $('#run-btn').innerHTML = '&#9889; Create PDF';
  });

  fileIn.addEventListener('change', () => addImages([...fileIn.files]));
  setupDrop(drop, fs => addImages(fs), true);
  $('#add-more').addEventListener('click', () => fileIn.click());
  $('#reset-btn').addEventListener('click', () => { images = []; render(); summary.hidden = true; fileIn.value = ''; });
})();
</script>
</body>
</html>
