<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Squeeze - image compressor</title>
<meta name="description" content="Compress images offline. Nothing leaves your device.">
<meta name="theme-color" content="#0a0e1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Squeeze">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:dark;--tx:#eef2ff;--mu:#a9b4d6;--ac:#7dd3fc;--ac2:#a78bfa;--gl:rgba(255,255,255,.07);--gb:rgba(255,255,255,.16)}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{background:#0a0e1f}
body{min-height:100vh;min-height:100dvh;font:16px/1.5 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);padding:max(22px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(45% 35% at 12% 8%,rgba(59,130,246,.55),transparent 70%),radial-gradient(40% 35% at 92% 28%,rgba(168,85,247,.45),transparent 70%),radial-gradient(55% 40% at 45% 100%,rgba(6,182,212,.4),transparent 70%),#0a0e1f}
main{max-width:640px;margin:0 auto;display:grid;gap:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:2rem;font-weight:700;letter-spacing:-.03em;line-height:1.1}
header p{color:var(--mu);font-size:.9rem}
.glass{background:var(--gl);border:1px solid var(--gb);border-radius:22px;-webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);box-shadow:0 8px 32px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.12)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(28,34,64,.9)}}
.btn{display:inline-block;padding:9px 16px;border-radius:999px;border:1px solid var(--gb);background:rgba(255,255,255,.1);color:var(--tx);font:inherit;font-size:.9rem;font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.18)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.drop{position:relative;display:grid;gap:4px;place-items:center;text-align:center;padding:40px 20px;border-style:dashed;cursor:pointer;transition:background .2s,border-color .2s}
.drop>*{pointer-events:none}
.drop b{font-size:1.15rem}
.drop span{color:var(--mu);font-size:.9rem}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop:hover,.drop.on{border-color:var(--ac);background:rgba(125,211,252,.1)}
.drop:focus-within{outline:2px solid var(--ac);outline-offset:3px}
.ctl{display:grid;gap:16px;padding:18px}
.f{display:grid;gap:8px}
.f>label,.f>span{color:var(--mu);font-size:.9rem}
input[type=range]{width:100%;accent-color:var(--ac)}
select{width:100%;padding:11px 12px;border-radius:14px;border:1px solid var(--gb);background:rgba(255,255,255,.08);color:var(--tx);font:inherit}
option{background:#161b33;color:var(--tx)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border:1px solid var(--gb);border-radius:14px;background:rgba(255,255,255,.05)}
.seg label{position:relative;display:block}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:block;text-align:center;padding:8px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--mu)}
.seg input:checked+span{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#0a0e1f}
.seg input:focus-visible+span{outline:2px solid #fff}
.seg input:disabled+span{opacity:.4;cursor:not-allowed}
.sum{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;font-size:.9rem}
#note{color:#fda4af;font-size:.85rem;text-align:center}
#note:empty{display:none}
ul{list-style:none;padding:0;display:grid;gap:10px}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:18px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.th{width:52px;height:52px;border-radius:12px;background:rgba(255,255,255,.08) center/cover no-repeat}
.tx{min-width:0}
.nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt{color:var(--mu);font-size:.82rem}
.row[data-s=busy] .th,.row[data-s=wait] .th{animation:p 1.1s ease-in-out infinite}
.row[data-s=err] .mt{color:#fda4af}
@keyframes p{50%{opacity:.4}}
#ios{color:var(--mu);font-size:.82rem;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<header>
<div><h1>Squeeze</h1><p>Compress images on your device. Works offline.</p></div>
<button id="ins" class="btn" type="button" hidden>Install</button>
</header>
<label class="glass drop" id="drop">
<input id="file" type="file" accept="image/*" multiple>
<b>Drop images here</b><span>or tap to choose. JPG, PNG, WebP.</span>
</label>
<section class="glass ctl" aria-label="Settings">
<div class="f"><label for="q">Quality <output id="qv">75</output>%</label><input id="q" type="range" min="10" max="100" value="75"></div>
<div class="f"><label for="m">Longest side</label>
<select id="m"><option value="4096">4096 px</option><option value="2560" selected>2560 px</option><option value="1920">1920 px</option><option value="1280">1280 px</option><option value="800">800 px</option></select></div>
<div class="f"><span id="fl">Format</span>
<div class="seg" role="radiogroup" aria-labelledby="fl">
<label><input type="radio" name="f" value="image/jpeg" checked><span>JPEG</span></label>
<label><input type="radio" name="f" value="image/webp"><span>WebP</span></label>
</div></div>
</section>
<section class="glass sum" id="sum" hidden><span id="st" aria-live="polite"></span><button id="clr" class="btn" type="button">Clear all</button></section>
<p id="note" role="status"></p>
<ul id="list"></ul>
<p id="ios" hidden>To install, tap Share, then Add to Home Screen.</p>
</main>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const list=$('#list'),sumEl=$('#sum'),stEl=$('#st'),note=$('#note'),fileIn=$('#file'),drop=$('#drop'),q=$('#q'),qv=$('#qv'),m=$('#m'),ins=$('#ins');
const items=[];let gen=0,timer=0,dip=null;
const OK=/^image\/(jpeg|png|webp|bmp|avif|heic|heif)$/,EXT=/\.(jpe?g|png|webp|bmp|avif|heic|heif)$/i;
const fmt=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(n<10240?1:0)+' KB':(n/1048576).toFixed(2)+' MB';
const kind=()=>$('input[name=f]:checked').value;
const canWebp=(()=>{try{const c=document.createElement('canvas');c.width=c.height=1;return c.toDataURL('image/webp').startsWith('data:image/webp')}catch{return false}})();
if(!canWebp){const r=$('input[value="image/webp"]');r.disabled=true;r.parentNode.title='This browser cannot save WebP'}

const mk=()=>{const li=document.createElement('li');li.className='glass row';li.innerHTML='<div class="th"></div><div class="tx"><b class="nm"></b><span class="mt"></span></div><a class="btn" hidden>Save</a>';return li};

function paint(it){
  const e=it.el,a=e.querySelector('a'),mt=e.querySelector('.mt');
  e.dataset.s=it.st;
  e.querySelector('.nm').textContent=it.file.name;
  a.hidden=it.st!=='done';
  if(it.st==='done'){
    const pct=Math.max(0,Math.round(100-100*it.blob.size/it.file.size));
    mt.textContent=it.kept?fmt(it.file.size)+', already small. Original kept.':fmt(it.file.size)+' → '+fmt(it.blob.size)+' (−'+pct+'%)';
    a.href=it.url;a.download=it.out;
  }else mt.textContent=it.st==='err'?it.msg:'Compressing…';
  if(it.url)e.querySelector('.th').style.backgroundImage='url("'+it.url+'")';
}

function sum(){
  const left=items.filter(i=>i.stale).length,done=items.filter(i=>i.st==='done');
  let a=0,b=0;for(const i of done){a+=i.file.size;b+=i.blob.size}
  stEl.textContent=left?'Compressing '+(items.length-left)+' of '+items.length+'…':done.length?done.length+(done.length>1?' images: ':' image: ')+fmt(a)+' → '+fmt(b)+', saved '+Math.max(0,Math.round(100-100*b/a))+'%':'Nothing compressed';
}

async function work(it,g){
  if(!it.file.size)throw new Error('This file is empty.');
  const type=kind(),max=+m.value,quality=q.value/100;
  let bmp;
  try{bmp=await createImageBitmap(it.file,{imageOrientation:'from-image'})}
  catch{bmp=await new Promise((ok,no)=>{const u=URL.createObjectURL(it.file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=()=>{URL.revokeObjectURL(u);no(new Error('Can’t read this image. Try JPG, PNG or WebP.'))};i.src=u})}
  const free=()=>{if(bmp.close)bmp.close()};
  if(g!==gen){free();return}
  const w0=bmp.naturalWidth||bmp.width,h0=bmp.naturalHeight||bmp.height;
  if(!w0||!h0){free();throw new Error('Can’t read this image. Try JPG, PNG or WebP.')}
  const k=Math.min(1,max/Math.max(w0,h0)),w=Math.max(1,Math.round(w0*k)),h=Math.max(1,Math.round(h0*k));
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');
  if(!x){free();throw new Error('This browser can’t process images. Try another browser.')}
  if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,w,h)}
  x.imageSmoothingQuality='high';
  x.drawImage(bmp,0,0,w,h);free();
  const blob=await new Promise(r=>c.toBlob(r,type,quality));
  c.width=c.height=0;
  if(g!==gen)return;
  if(!blob||blob.type!==type)throw new Error('This browser can’t save that format. Choose JPEG.');
  const keep=k===1&&blob.size>=it.file.size,res=keep?it.file:blob,u=URL.createObjectURL(res);
  if(it.url)URL.revokeObjectURL(it.url);
  Object.assign(it,{blob:res,url:u,kept:keep,st:'done',stale:false,out:keep?it.file.name:it.file.name.replace(/\.[^.]*$/,'')+'-min.'+(type==='image/webp'?'webp':'jpg')});
  paint(it);
}

async function run(){
  const g=++gen;
  for(const it of items){
    if(!it.stale)continue;
    it.st='busy';paint(it);sum();
    try{await work(it,g)}
    catch(e){if(g!==gen)return;it.st='err';it.msg=e&&e.message||'Could not compress this image.';it.stale=false;paint(it)}
    if(g!==gen)return;
    sum();
  }
  sum();
}

function add(files){
  let skip=0,added=0;
  for(const f of files){
    if(!(OK.test(f.type)||EXT.test(f.name))){skip++;continue}
    const it={file:f,stale:true,st:'wait',msg:'',url:null,blob:null,kept:false,out:'',el:mk()};
    items.push(it);list.appendChild(it.el);paint(it);added++;
  }
  note.textContent=skip?'Skipped '+skip+(skip>1?' files':' file')+' that aren’t JPG, PNG or WebP.':'';
  if(added){sumEl.hidden=false;run()}
}

const again=()=>{clearTimeout(timer);timer=setTimeout(()=>{if(!items.length)return;items.forEach(i=>{i.stale=true});run()},300)};
q.addEventListener('input',()=>{qv.textContent=q.value;again()});
m.addEventListener('change',again);
document.querySelectorAll('input[name=f]').forEach(r=>r.addEventListener('change',again));

$('#clr').addEventListener('click',()=>{
  gen++;clearTimeout(timer);
  for(const i of items)if(i.url)URL.revokeObjectURL(i.url);
  items.length=0;list.textContent='';sumEl.hidden=true;note.textContent='';
});

fileIn.addEventListener('change',()=>{const f=[...fileIn.files];fileIn.value='';add(f)});
['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('on')}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('on');if(t==='drop'&&e.dataTransfer)add([...e.dataTransfer.files])}));
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>e.preventDefault());
addEventListener('paste',e=>{const f=e.clipboardData?[...e.clipboardData.files]:[];if(f.length)add(f)});

addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;ins.hidden=false});
ins.addEventListener('click',async()=>{if(!dip)return;dip.prompt();try{await dip.userChoice}catch{}dip=null;ins.hidden=true});
addEventListener('appinstalled',()=>{ins.hidden=true});
const ua=navigator.userAgent;
if((/iphone|ipad|ipod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))&&!navigator.standalone)$('#ios').hidden=false;

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
})();
</script>
</body>
</html>
